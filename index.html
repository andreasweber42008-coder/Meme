<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wohnung Rundgang</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6df; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
    #hud button { pointer-events: auto; border: 0; border-radius: 6px; padding: 6px 10px; background: rgba(255,255,255,.85); color: #222; font-size: 13px; cursor: pointer; }
    #hud button:hover { background: #fff; }
    #help { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(20,20,20,.72); color: #fff; padding: 18px 22px; border-radius: 10px; text-align: center; line-height: 1.5; cursor: pointer; max-width: calc(100vw - 64px); }
    #room { position: fixed; left: 12px; bottom: 12px; color: #222; background: rgba(255,255,255,.8); padding: 4px 10px; border-radius: 6px; font-size: 13px; }
    #pad { position: fixed; right: 16px; bottom: 16px; display: none; gap: 6px; grid-template-columns: repeat(3, 48px); }
    #pad button { height: 48px; border: 0; border-radius: 8px; background: rgba(255,255,255,.8); font-size: 18px; }
    body.shot #hud, body.shot #help, body.shot #room, body.shot #pad { display: none !important; }
    @media (pointer: coarse) { #pad { display: grid; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
  </script>
</head>
<body>
  <div id="hud"></div>
  <div id="help">Klicken zum Umsehen<br/>W A S D / Pfeiltasten gehen · Maus schauen · Shift schneller<br/>Esc gibt die Maus frei · Knöpfe oben springen in einen Raum</div>
  <div id="room"></div>
  <div id="pad">
    <span></span><button data-k="KeyW">▲</button><span></span>
    <button data-k="KeyQ">⟲</button><button data-k="KeyS">▼</button><button data-k="KeyE">⟳</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
