<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1f8a5b" />
    <title>Munggi</title>
    <meta name="description" content="Persönliche Lern-App für den EMS" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Dunkelmodus (Einstellung oder System), bevor React lädt – kein Aufblitzen.
      var design = null;
      try { design = localStorage.getItem("munggi-design"); } catch (e) {}
      if (design === "dunkel" || (design !== "hell" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
